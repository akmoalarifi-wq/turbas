<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترباس شركاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1A1D21;--card:#252A30;--border:#353B42;--amber:#E8A33D;--good:#6FBF8B;--text:#F2F0EA;--dim:#9AA0A6;--danger:#e57373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh}
.screen{display:none;flex-direction:column;min-height:100vh;padding:18px 16px 40px}
.screen.active{display:flex}
h1{font-size:18px;margin:0 0 4px}.dim{color:var(--dim);font-size:12px}.amber{color:var(--amber);font-weight:800}
.field{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:13px;color:var(--text);font-family:Cairo;font-size:15px;margin-bottom:10px}
.btn{background:var(--amber);color:#1a1a1a;border:none;padding:14px;border-radius:12px;font-weight:800;width:100%;font-family:Cairo;cursor:pointer}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:10px 12px;font-size:12px;width:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:12px;cursor:pointer;min-width:70px}
.tab.on{background:var(--amber);color:#1a1a1a;border-color:var(--amber);font-weight:700}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--amber)}.stat span{font-size:11px;color:var(--dim)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(232,163,61,.15);color:var(--amber)}
.back{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:12px;cursor:pointer}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;margin-bottom:8px;font-size:13px}
.msg.me{background:var(--amber);color:#1a1a1a;align-self:flex-end}
.msg.them{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.chatbox{display:flex;flex-direction:column;flex:1;min-height:180px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--good);color:#132;padding:12px 18px;border-radius:28px;font-weight:700;font-size:13px;z-index:99;opacity:0;transition:.25s}
.toast.show{opacity:1}
label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
<div class="screen active" id="s-login">
  <h1 style="font-size:22px;margin-top:20px">ترباس <span class="amber">شركاء</span></h1>
  <p class="dim" style="margin:8px 0 20px">لوحة الورشة والمحل · صناعية العاصمة</p>
  <input class="field" id="phone" value="0500000001" placeholder="الجوال">
  <button class="btn" onclick="login()">دخول</button>
  <p class="dim" style="margin-top:14px;text-align:center">ورشة: 0500000001 · محل: 0500000006</p>
</div>

<div class="screen" id="s-home">
  <div class="row">
    <div><div class="dim">مرحباً</div><h1 id="pName">—</h1><div class="dim" id="pArea"></div></div>
    <span class="dim" style="cursor:pointer" onclick="logout()">خروج</span>
  </div>
  <div class="row" style="gap:8px;margin:12px 0" id="statsRow"></div>
  <div class="card" style="cursor:default">
    <div class="row"><span class="dim">مبيعات</span><span class="amber" id="stSales">0</span></div>
    <div class="row" style="margin-top:6px"><span class="dim">عمولة ترباس 15%</span><span id="stComm">0</span></div>
    <div class="row" style="margin-top:6px"><span class="dim">صافي مستحق</span><span class="amber" id="stNet">0</span></div>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="orders" onclick="tab(this)">الطلبات</div>
    <div class="tab" data-t="catalog" onclick="tab(this)">خدماتي</div>
    <div class="tab" data-t="add" onclick="tab(this)">إضافة</div>
  </div>
  <div class="tabs" id="ordFilter" style="display:none">
    <div class="tab on" data-f="paid" onclick="ofilt(this)">جديدة</div>
    <div class="tab" data-f="confirmed" onclick="ofilt(this)">مؤكدة</div>
    <div class="tab" data-f="in_progress" onclick="ofilt(this)">جارية</div>
    <div class="tab" data-f="done" onclick="ofilt(this)">مكتملة</div>
  </div>
  <div id="body"></div>
</div>

<div class="screen" id="s-order">
  <div class="back" onclick="show('s-home');load()">‹</div>
  <h1 id="oTitle">طلب</h1>
  <p class="dim" id="oMeta"></p>
  <div class="card" style="cursor:default">
    <div class="row"><b id="oSvc">—</b><span class="amber" id="oPrice">—</span></div>
    <div class="dim" style="margin-top:8px" id="oCar"></div>
    <div class="dim" style="margin-top:6px" id="oComm"></div>
  </div>
  <p class="dim">الحالة: <b id="oSt">—</b></p>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">
    <button class="btn btn-sm" onclick="setSt('confirmed')">تأكيد</button>
    <button class="btn btn-sm" onclick="setSt('in_progress')">بدء العمل</button>
    <button class="btn btn-sm" onclick="setSt('done')">مكتمل</button>
  </div>
  <button class="btn" onclick="openChat()">محادثة</button>
  <button class="btn btn-ghost" style="margin-top:8px" onclick="showAddon()">إضافة خدمة للطلب</button>
  <div id="addonBox" style="display:none;margin-top:12px">
    <label>الخدمة الإضافية</label><input class="field" id="adTitle" placeholder="تغيير فحمات خلفية">
    <label>السعر</label><input class="field" id="adPrice" type="number" placeholder="350">
    <label>السبب</label><input class="field" id="adReason" placeholder="مستهلكة">
    <button class="btn" onclick="sendAddon()">إرسال للعميل للموافقة</button>
  </div>
</div>

<div class="screen" id="s-chat">
  <div class="back" onclick="show('s-order')">‹</div>
  <h1>محادثة</h1>
  <div class="chatbox" id="chatBox" style="flex-direction:column-reverse"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <input class="field" id="chatIn" style="margin:0" placeholder="اكتب...">
    <button class="btn" style="width:auto;padding:13px 16px" onclick="sendMsg()">إرسال</button>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const API='';
let partner=null, orders=[], offers=[], products=[], tabName='orders', oFilter='paid', cur=null;
async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.statusText);return d}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

async function login(){
  try{
    const res=await api('/api/partners/login',{method:'POST',body:{phone:document.getElementById('phone').value.trim()}});
    partner=res.partner; localStorage.setItem('turbas_partner',JSON.stringify(partner));
    document.getElementById('pName').textContent=partner.name;
    document.getElementById('pArea').textContent=partner.area||'صناعية العاصمة';
    await load(); show('s-home');
  }catch(e){toast(e.message)}
}
function logout(){partner=null;localStorage.removeItem('turbas_partner');show('s-login')}
function tab(el){document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');tabName=el.dataset.t;render()}
function ofilt(el){document.querySelectorAll('#ordFilter .tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');oFilter=el.dataset.f;render()}

async function load(){
  const st=await api('/api/partner/stats?partner_id='+partner.id);
  document.getElementById('statsRow').innerHTML=`
    <div class="stat"><b>${st.new}</b><span>جديدة</span></div>
    <div class="stat"><b>${st.in_progress}</b><span>جارية</span></div>
    <div class="stat"><b>${st.done}</b><span>مكتملة</span></div>`;
  document.getElementById('stSales').textContent=st.sales+' ر.س';
  document.getElementById('stComm').textContent=st.commission+' ر.س';
  document.getElementById('stNet').textContent=st.net+' ر.س';
  orders=await api('/api/orders?partner_id='+partner.id);
  if(partner.type==='workshop') offers=await api('/api/offers?partner_id='+partner.id);
  else products=await api('/api/products?partner_id='+partner.id);
  render();
}
function render(){
  const body=document.getElementById('body');
  document.getElementById('ordFilter').style.display=tabName==='orders'?'flex':'none';
  if(tabName==='orders'){
    const list=orders.filter(o=>o.status===oFilter||(oFilter==='paid'&&(o.status==='paid'||o.status==='new')));
    body.innerHTML=list.length?list.map(o=>`
      <div class="card" onclick="openOrder(${o.id})">
        <div class="row"><b>${o.title}</b><span class="badge">${o.status_text}</span></div>
        <div class="dim" style="margin-top:6px">${o.car_info||''} · #${o.id}</div>
        <div class="row" style="margin-top:8px"><span class="amber">${o.price} ر.س</span></div>
      </div>`).join(''):'<p class="dim" style="text-align:center;padding:24px">ما فيه طلبات</p>';
  } else if(tabName==='catalog'){
    if(partner.type==='workshop'){
      body.innerHTML=offers.map(o=>`
        <div class="card" style="cursor:default">
          <div class="row"><b>${o.service_name}</b><span class="amber">${o.price} ر.س</span></div>
          <div class="dim" style="margin-top:6px">${o.duration||''} · ضمان ${o.warranty_days} يوم</div>
          <button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="delOffer(${o.id})">حذف</button>
        </div>`).join('')||'<p class="dim">أضف عروض خدمات لتظهر في المقارنة</p>';
    } else {
      body.innerHTML=products.map(p=>`
        <div class="card" style="cursor:default">
          <div class="row"><b>${p.name}</b><span class="amber">${p.price} ر.س</span></div>
          <div class="dim">${p.category} · ${p.grade||''}</div>
          <button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="delProd(${p.id})">حذف</button>
        </div>`).join('')||'<p class="dim">أضف منتجات</p>';
    }
  } else {
    if(partner.type==='workshop'){
      body.innerHTML=`
        <p class="dim" style="margin-bottom:10px">اختر خدمة من كتالوج ترباس وضع سعرك — تظهر للعملاء بدون اسمك حتى الدفع</p>
        <label>معرّف الخدمة (service_def_id)</label>
        <input class="field" id="fSid" placeholder="1 = فحمات أمامية، 2 خلفية، 5 فحص فرامل...">
        <label>السعر</label><input class="field" id="fPrice" type="number" placeholder="290">
        <label>المدة</label><input class="field" id="fDur" placeholder="45 دقيقة">
        <label>الضمان (أيام)</label><input class="field" id="fWar" type="number" value="90">
        <label>يشمل</label><input class="field" id="fInc" placeholder="فحمات · فك وتركيب">
        <label>لا يشمل</label><input class="field" id="fExc" placeholder="هوبات">
        <button class="btn" onclick="addOffer()">نشر العرض</button>
        <p class="dim" style="margin-top:10px">1 فحمات أمامية · 2 خلفية · 3 خرط هوبات · 5 فحص فرامل · 7 فحص مكينة · 11 دينمو · 15 رديتر · 17 فريون</p>`;
    } else {
      body.innerHTML=`
        <label>اسم المنتج</label><input class="field" id="fName" placeholder="فلتر زيت">
        <label>التصنيف</label><select class="field" id="fCat"><option>فلاتر</option><option>زيوت</option><option>بطاريات</option><option>كفرات</option></select>
        <label>السعر</label><input class="field" id="fPrice" type="number">
        <label>الماركة</label><input class="field" id="fBrand">
        <label>الفئة</label><select class="field" id="fGrade"><option>أصلي</option><option>درجة أولى</option><option>تجاري</option></select>
        <label>رقم القطعة</label><input class="field" id="fNum">
        <label>ماركات السيارات</label><input class="field" id="fBrands" placeholder="تويوتا">
        <label>الموديلات</label><input class="field" id="fModels" placeholder="كامري">
        <label>السنوات</label><input class="field" id="fYears" placeholder="2018-2024">
        <label>الضمان</label><input class="field" id="fWar" value="ضمان المحل">
        <button class="btn" onclick="addProd()">حفظ المنتج</button>`;
    }
  }
}
async function addOffer(){
  await api('/api/offers',{method:'POST',body:{
    partner_id:partner.id, service_def_id:+document.getElementById('fSid').value,
    price:+document.getElementById('fPrice').value, duration:document.getElementById('fDur').value,
    warranty_days:+document.getElementById('fWar').value||30,
    includes:document.getElementById('fInc').value, excludes:document.getElementById('fExc').value
  }});
  toast('تم نشر العرض للعملاء'); tabName='catalog'; await load();
}
async function addProd(){
  await api('/api/products',{method:'POST',body:{
    partner_id:partner.id, name:document.getElementById('fName').value,
    category:document.getElementById('fCat').value, price:+document.getElementById('fPrice').value,
    brand:document.getElementById('fBrand').value, grade:document.getElementById('fGrade').value,
    part_number:document.getElementById('fNum').value, brands:document.getElementById('fBrands').value,
    models:document.getElementById('fModels').value, years:document.getElementById('fYears').value,
    warranty:document.getElementById('fWar').value
  }});
  toast('تم'); tabName='catalog'; await load();
}
async function delOffer(id){await fetch(API+'/api/offers/'+id,{method:'DELETE'});load()}
async function delProd(id){await fetch(API+'/api/products/'+id,{method:'DELETE'});load()}

async function openOrder(id){
  cur=await api('/api/orders/'+id);
  document.getElementById('oTitle').textContent='طلب #'+cur.id;
  document.getElementById('oMeta').textContent=(cur.created_at||'').slice(0,16);
  document.getElementById('oSvc').textContent=cur.title;
  document.getElementById('oPrice').textContent=cur.price+' ر.س';
  document.getElementById('oCar').textContent=cur.car_info||'—';
  document.getElementById('oComm').textContent='صافي بعد 15%: '+(cur.price*0.85).toFixed(0)+' ر.س';
  document.getElementById('oSt').textContent=cur.status_text;
  document.getElementById('addonBox').style.display='none';
  show('s-order');
}
async function setSt(st){
  await api('/api/orders/'+cur.id+'/status',{method:'POST',body:{status:st}});
  toast('تم التحديث'); load(); openOrder(cur.id);
}
function showAddon(){document.getElementById('addonBox').style.display='block'}
async function sendAddon(){
  await api('/api/orders/'+cur.id+'/addons',{method:'POST',body:{
    title:document.getElementById('adTitle').value,
    price:+document.getElementById('adPrice').value,
    reason:document.getElementById('adReason').value
  }});
  toast('أُرسل للعميل للموافقة والدفع');
  document.getElementById('addonBox').style.display='none';
}
async function openChat(){
  const msgs=await api('/api/orders/'+cur.id+'/messages');
  document.getElementById('chatBox').innerHTML=msgs.length?msgs.slice().reverse().map(m=>
    `<div class="msg ${m.sender==='workshop'?'me':'them'}">${m.body}</div>`).join(''):'<p class="dim">لا رسائل</p>';
  show('s-chat');
}
async function sendMsg(){
  const i=document.getElementById('chatIn'); const v=i.value.trim(); if(!v)return;
  await api('/api/orders/'+cur.id+'/messages',{method:'POST',body:{sender:'workshop',body:v}});
  i.value=''; openChat();
}
setInterval(()=>{if(partner&&document.getElementById('s-home').classList.contains('active')&&tabName==='orders')load()},10000);
try{const s=localStorage.getItem('turbas_partner');if(s){partner=JSON.parse(s);document.getElementById('pName').textContent=partner.name;load().then(()=>show('s-home'))}}catch(e){}
</script>
</body>
</html>
